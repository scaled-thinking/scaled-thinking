<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 416" width="1100" height="416" role="img" aria-labelledby="title desc">
  <title id="title">My route since 2020</title>
  <desc id="desc">My route since 2020, in nine stations. 2020, first contact with AI: machine learning. 2021, IT strategy: designing how technology serves an organisation. 2022, the ChatGPT moment: chatbots for everyone. 2023, first agents: early experiments with AutoGPT. October 2025, the turning point: from competing with AI to learning with it. Since then, orchestration: several agents in one workflow, and I stay the one who decides. 2026, self-improving systems: agents that improve their own work, and my first open repositories. Ahead, the way I see it: superintelligence in 2027 or 2028, and we need to upskill to make the best use of it; then fully autonomous agent organisations, where startups of one to four people do the work of hundreds, some at unicorn scale.</desc>
