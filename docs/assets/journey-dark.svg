<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 212" width="1100" height="212" role="img" aria-labelledby="title desc">
  <title id="title">My route since October 2025</title>
  <desc id="desc">My route since October 2025, in four stations. October 2025, the turning point: from competing with AI to learning with it. Since then, all in: AI in my daily work, and I stay the one who decides. November 2026, going public: first open repositories, after private projects since 2023. Next: an agent-first platform, in progress.</desc>
  <text x="20" y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="1.5" fill="#9198a1">MY ROUTE SINCE OCTOBER 2025</text>
  <line x1="152.5" y1="100" x2="682.5" y2="100" stroke="#2fb8b0" stroke-width="3" stroke-linecap="round" />
  <line x1="682.5" y1="100" x2="947.5" y2="100" stroke="#2fb8b0" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round" />
  <text x="152.5" y="68" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#9198a1">OCT 2025</text>
  <circle cx="152.5" cy="100" r="13" fill="#2fb8b0" stroke="#0d1117" stroke-width="4" />
  <text x="152.5" y="146" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f0f6fc">The turning point</text>
  <text x="152.5" y="172" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#f0f6fc">from competing with AI</text>
  <text x="152.5" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#f0f6fc">to learning with it</text>
  <text x="417.5" y="68" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#9198a1">SINCE THEN</text>
  <circle cx="417.5" cy="100" r="13" fill="#2fb8b0" stroke="#0d1117" stroke-width="4" />
  <text x="417.5" y="146" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f0f6fc">All in</text>
  <text x="417.5" y="172" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#f0f6fc">AI in my daily work,</text>
  <text x="417.5" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#f0f6fc">I stay the one who decides</text>
  <text x="682.5" y="68" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#9198a1">NOV 2026</text>
  <circle cx="682.5" cy="100" r="13" fill="#2fb8b0" stroke="#0d1117" stroke-width="4" />
  <text x="682.5" y="146" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f0f6fc">Going public</text>
  <text x="682.5" y="172" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#f0f6fc">first open repositories,</text>
  <text x="682.5" y="194" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" fill="#f0f6fc">after private projects since 2023</text>
  <text x="947.5" y="68" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="#9198a1">NEXT</text>
  <circle cx="947.5" cy="100" r="13" fill="#0d1117" stroke="#2fb8b0" stroke-width="3" />
  <text x="947.5" y="146" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#f0f6fc">Agent-first platform</text>
